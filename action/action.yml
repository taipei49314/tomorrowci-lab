name: TomorrowCI
description: Continuous Integration Against the Future — scan for breakage horizons
author: TomorrowCI Contributors

branding:
  icon: activity
  color: blue

inputs:
  path:
    description: Repository path to scan
    required: false
    default: "."
  config:
    description: Optional path to .tomorrowci.yml
    required: false
    default: ""
  advisory:
    description: Softens horizon regression policy only; never converts BLOCKED to PASS
    required: false
    default: "true"
  base-run-id:
    description: Optional base run id for horizon comparison
    required: false
    default: ""
  expect-horizon:
    description: Require baseline PASS + FUTURE_FAIL + signature + observed + verify PASS
    required: false
    default: "false"

outputs:
  run-id:
    description: TomorrowCI run id
    value: ${{ steps.scan.outputs.run_id }}
  frontier-observed:
    description: Whether a breakage horizon was observed
    value: ${{ steps.scan.outputs.frontier_observed }}

runs:
  using: composite
  steps:
    - name: Locate or build CLI from action repository
      id: bin
      shell: bash
      run: |
        set -euo pipefail
        ACTION_ROOT="$(cd "${{ github.action_path }}/.." && pwd)"
        TARGET_DIR="${RUNNER_TEMP:-/tmp}/tomorrowci-target"
        mkdir -p "$TARGET_DIR"
        BIN="$TARGET_DIR/release/tomorrowci"
        if [[ ! -x "$BIN" ]]; then
          echo "Building tomorrowci-cli from action root: $ACTION_ROOT"
          cargo build -p tomorrowci-cli --release --manifest-path "$ACTION_ROOT/Cargo.toml" --target-dir "$TARGET_DIR"
        fi
        test -x "$BIN"
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"
        echo "action_root=$ACTION_ROOT" >> "$GITHUB_OUTPUT"

    - name: Trust audit
      shell: bash
      run: |
        set -euo pipefail
        "${{ steps.bin.outputs.bin }}" trust

    - name: Scan
      id: scan
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.bin }}"
        CFG_ARGS=()
        if [[ -n "${{ inputs.config }}" ]]; then
          CFG_ARGS+=(--config "${{ inputs.config }}")
        fi
        SCAN_PATH="${{ inputs.path }}"
        CODE=0
        if OUT=$("$BIN" scan "$SCAN_PATH" "${CFG_ARGS[@]}" --json 2>&1); then
          CODE=0
        else
          CODE=$?
        fi
        echo "$OUT"
        # Structured run_id only — no latest-directory fallback
        RUN_ID=$(echo "$OUT" | python3 "${{ github.action_path }}/extract-run-id.py" || true)
        if [[ -z "$RUN_ID" ]]; then
          echo "scan did not return a structured run_id" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        RUN_DIR="$SCAN_PATH/.tomorrowci/runs/$RUN_ID"
        if [[ ! -d "$RUN_DIR" ]]; then
          RUN_DIR=".tomorrowci/runs/$RUN_ID"
        fi
        if [[ ! -d "$RUN_DIR" ]]; then
          echo "evidence directory missing for run_id=$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
        export RUN_DIR
        eval "$(python3 "${{ github.action_path }}/parse-evidence.py" "$RUN_DIR")"
        if [[ -f "${RUN_DIR}/job-summary.md" ]]; then
          cat "${RUN_DIR}/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if ! (cd "$SCAN_PATH" && "$BIN" verify "$RUN_ID") && ! "$BIN" verify "$RUN_ID"; then
          echo "evidence verify failed" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [[ "${TCI_BLOCKED:-0}" == "1" ]]; then
          echo "Scan produced BLOCKED scenario(s)." >> "$GITHUB_STEP_SUMMARY"
          exit 2
        fi
        if [[ "$CODE" -ne 0 ]]; then
          echo "Unexpected scan exit code $CODE" >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"
        fi
        if [[ "${{ inputs.expect-horizon }}" == "true" ]]; then
          if [[ "${TCI_BASELINE_PASS:-0}" != "1" || "${TCI_FUTURE_FAIL:-0}" != "1" || "${TCI_SIG:-0}" != "1" || "${TCI_FO:-0}" != "1" ]]; then
            echo "expect-horizon failed baseline=$TCI_BASELINE_PASS future=$TCI_FUTURE_FAIL sig=$TCI_SIG fo=$TCI_FO" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        fi

    - name: Prepare evidence for upload
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        # Drop workspace/.tomorrowci scenario state (not in workspace-manifest); keep .tomorrowci.yml
        for base in "${{ inputs.path }}/.tomorrowci/runs" ".tomorrowci/runs"; do
          if [ -d "$base" ]; then
            while IFS= read -r -d '' d; do
              sudo rm -rf "$d" 2>/dev/null || rm -rf "$d" || true
            done < <(find "$base" -type d -path '*/workspace/.tomorrowci' -print0 2>/dev/null || true)
          fi
        done

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tomorrowci-evidence-${{ steps.scan.outputs.run_id || 'unknown' }}
        path: |
          ${{ inputs.path }}/.tomorrowci/runs/
          .tomorrowci/runs/
        if-no-files-found: warn
        include-hidden-files: true

    - name: Compare horizons
      if: ${{ inputs.base-run-id != '' }}
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.bin }}"
        HEAD="${{ steps.scan.outputs.run_id }}"
        if "$BIN" compare --base "${{ inputs.base-run-id }}" --head "$HEAD" --gate; then
          exit 0
        else
          if [[ "${{ inputs.advisory }}" == "true" ]]; then
            echo "Horizon gate failed (advisory softens regression only)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 3
        fi
