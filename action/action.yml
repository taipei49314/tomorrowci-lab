name: TomorrowCI
description: Continuous Integration Against the Future — scan for breakage horizons
author: TomorrowCI Contributors

branding:
  icon: activity
  color: blue

inputs:
  path:
    description: Repository path to scan
    required: false
    default: "."
  config:
    description: Optional path to .tomorrowci.yml
    required: false
    default: ""
  advisory:
    description: If true, never fail the job solely because a horizon was found
    required: false
    default: "true"
  base-run-id:
    description: Optional base run id for horizon comparison
    required: false
    default: ""
  expect-horizon:
    description: If true, require frontier.observed (fixture acceptance)
    required: false
    default: "false"

outputs:
  run-id:
    description: TomorrowCI run id
    value: ${{ steps.scan.outputs.run_id }}
  frontier-observed:
    description: Whether a breakage horizon was observed
    value: ${{ steps.scan.outputs.frontier_observed }}

runs:
  using: composite
  steps:
    - name: Locate or build CLI from action repository
      id: bin
      shell: bash
      run: |
        set -euo pipefail
        ACTION_ROOT="$(cd "${{ github.action_path }}/.." && pwd)"
        TARGET_DIR="${RUNNER_TEMP:-/tmp}/tomorrowci-target"
        mkdir -p "$TARGET_DIR"
        BIN="$TARGET_DIR/release/tomorrowci"
        if [[ ! -x "$BIN" ]]; then
          echo "Building tomorrowci-cli from action root: $ACTION_ROOT"
          cargo build -p tomorrowci-cli --release --manifest-path "$ACTION_ROOT/Cargo.toml" --target-dir "$TARGET_DIR"
        fi
        test -x "$BIN"
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"
        echo "action_root=$ACTION_ROOT" >> "$GITHUB_OUTPUT"

    - name: Trust audit
      shell: bash
      run: |
        set -euo pipefail
        "${{ steps.bin.outputs.bin }}" trust

    - name: Scan
      id: scan
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.bin }}"
        CFG_ARGS=()
        if [[ -n "${{ inputs.config }}" ]]; then
          CFG_ARGS+=(--config "${{ inputs.config }}")
        fi
        SCAN_PATH="${{ inputs.path }}"
        set +e
        OUT=$("$BIN" scan "$SCAN_PATH" "${CFG_ARGS[@]}" 2>&1)
        CODE=$?
        set -e
        echo "$OUT"
        # Never treat BLOCKED as success for non-advisory infrastructure
        if echo "$OUT" | grep -q "verdict: BLOCKED"; then
          echo "Scan BLOCKED (infrastructure)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.advisory }}" == "true" ]]; then
            echo "Advisory mode: job continues, but frontier is not a PASS." >> "$GITHUB_STEP_SUMMARY"
          else
            exit 2
          fi
        fi
        # Evidence is written under the scan target path
        RUN_DIR=$(ls -1dt "$SCAN_PATH"/.tomorrowci/runs/* 2>/dev/null | head -1 || true)
        if [[ -z "${RUN_DIR}" || ! -d "${RUN_DIR}" ]]; then
          RUN_DIR=$(ls -1dt .tomorrowci/runs/* 2>/dev/null | head -1 || true)
        fi
        if [[ -z "${RUN_DIR}" || ! -d "${RUN_DIR}" ]]; then
          echo "No evidence run directory produced" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        RUN_ID=$(basename "${RUN_DIR}")
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
        if [[ -f "${RUN_DIR}/frontier.json" ]]; then
          FO=$(python3 -c "import json,sys; print('true' if json.load(open(sys.argv[1])).get('observed') else 'false')" "$RUN_DIR/frontier.json" 2>/dev/null || echo false)
        else
          FO=false
        fi
        echo "frontier_observed=$FO" >> "$GITHUB_OUTPUT"
        if [[ -f "${RUN_DIR}/job-summary.md" ]]; then
          cat "${RUN_DIR}/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [[ -f "${RUN_DIR}/metrics.json" ]]; then
          echo '### Metrics' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "${RUN_DIR}/metrics.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi
        # Contract: expect-horizon for fixture acceptance
        if [[ "${{ inputs.expect-horizon }}" == "true" && "$FO" != "true" ]]; then
          echo "Expected breakage horizon was not observed (frontier_observed=$FO)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        # Horizon discovery is product success; do not fail solely for that.
        # Fail on unexpected CLI crashes (non-zero without BLOCKED path handled above).
        if [[ "$CODE" -ne 0 && "$CODE" -ne 2 ]]; then
          if [[ "${{ inputs.advisory }}" != "true" ]]; then
            exit "$CODE"
          fi
        fi

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tomorrowci-evidence-${{ steps.scan.outputs.run_id || 'unknown' }}
        path: |
          ${{ inputs.path }}/.tomorrowci/runs/
          .tomorrowci/runs/
        if-no-files-found: warn

    - name: Compare horizons
      if: ${{ inputs.base-run-id != '' }}
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.bin }}"
        HEAD=$(ls -1dt .tomorrowci/runs/* | head -1 | xargs basename)
        "$BIN" compare --base "${{ inputs.base-run-id }}" --head "$HEAD" --gate || {
          if [[ "${{ inputs.advisory }}" == "true" ]]; then
            echo "Horizon gate failed (advisory)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 3
        }
