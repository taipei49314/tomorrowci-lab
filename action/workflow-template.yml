# Generated by `tomorrowci init-action`.
# Every third-party reference is an immutable reviewed commit. Update the
# TomorrowCI commit deliberately when adopting a newer compatible contract.
name: tomorrowci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tomorrowci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Run pinned TomorrowCI composite Action
        uses: taipei49314/tomorrowci-lab/action@590d96cd0bc1a3ab74e35a9df0a975ac42b0b9d0
        with:
          path: .
          advisory: "true"
