# Generated by `tomorrowci init-action`
# Invokes the checked-in composite Action (no || true masking).
name: tomorrowci
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  tomorrowci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: TomorrowCI scan
        id: tci
        uses: ./action
        with:
          path: .
          advisory: "false"
          expect-horizon: "false"
      - name: Upload exact run evidence
        if: always() && steps.tci.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: tomorrowci-evidence-${{ steps.tci.outputs.run_id }}
          path: .tomorrowci/runs/${{ steps.tci.outputs.run_id }}/
