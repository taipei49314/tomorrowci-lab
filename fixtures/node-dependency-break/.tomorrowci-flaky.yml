version: 1
project:
  ecosystem: node
  test_command: npm run test:flaky
baseline:
  runtime: "20"
  dependencies: locked
candidates:
  runtime:
    channels: [stable]
    max_versions: 1
  dependencies:
    latest_allowed: false
    prerelease: false
execution:
  max_scenarios: 2
  timeout_seconds: 180
  reruns_on_failure: 3
sandbox:
  engine: docker
  memory_mb: 1024
  cpus: 1
  pids_limit: 128
report:
  html: true
  json: true
