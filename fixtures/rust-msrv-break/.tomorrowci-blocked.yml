version: 1
project:
  ecosystem: rust
  test_command: cargo test
baseline:
  runtime: "1.83"
  dependencies: locked
candidates:
  runtime:
    channels: [stable]
    max_versions: 1
  dependencies:
    latest_allowed: false
    prerelease: false
execution:
  max_scenarios: 2
  timeout_seconds: 180
  reruns_on_failure: 2
sandbox:
  engine: docker
  memory_mb: 1024
  cpus: 1
  pids_limit: 128
report:
  html: true
  json: true
