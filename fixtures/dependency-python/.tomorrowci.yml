version: 1
project:
  ecosystem: python
  test_command: python test_contract.py
baseline:
  runtime: "3.11"
  dependencies: locked
candidates:
  runtime:
    channels: [stable]
    max_versions: 0
  dependencies:
    latest_allowed: true
    prerelease: false
execution:
  max_scenarios: 12
  timeout_seconds: 300
  reruns_on_failure: 3
sandbox:
  engine: auto
  memory_mb: 2048
  cpus: 2
  pids_limit: 256
