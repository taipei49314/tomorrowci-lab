name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate authoritative source version
        run: python3 scripts/version_contract.py

  acceptance:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [acceptance, identity]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Build exact host target
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          test "$HOST" = "${{ matrix.target }}"
          cargo build -p tomorrowci-cli --release --locked --target "${{ matrix.target }}"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/version_contract.py)"
          VER="v$VERSION"
          STAGE="tomorrowci-${VER}-${{ matrix.target }}"
          mkdir -p "dist/$STAGE"
          cp "target/${{ matrix.target }}/release/tomorrowci" "dist/$STAGE/"
          cp README.md LICENSE CHANGELOG.md "dist/$STAGE/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          "target/${{ matrix.target }}/release/tomorrowci" --version | tee dist/version.txt
          test "$(cat dist/version.txt)" = "tomorrowci $VERSION"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (python scripts/version_contract.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw "version contract failed" }
          $ver = "v$version"
          $stage = "tomorrowci-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tomorrowci.exe" "dist/$stage/"
          Copy-Item README.md,LICENSE,CHANGELOG.md "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $actual = (& "target/${{ matrix.target }}/release/tomorrowci.exe" --version).Trim()
          $actual | Set-Content -Encoding ascii dist/version.txt
          if ($actual -ne "tomorrowci $version") { throw "CLI version mismatch: $actual" }
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  candidate-index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: artifacts
      - name: Build exact candidate metadata and require four platform archives
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/version_contract.py)"
          mkdir -p dist
          mapfile -d '' archives < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0)
          test "${#archives[@]}" -eq 4
          for archive in "${archives[@]}"; do
            destination="dist/$(basename "$archive")"
            test ! -e "$destination"
            cp "$archive" "$destination"
          done
          cp docs/CLAIM_TO_EVIDENCE.md dist/claim-to-evidence.md
          python3 scripts/generate_sbom.py --output dist/sbom.cdx.json
          cd dist
          ls -la
          expected=(
            "tomorrowci-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "tomorrowci-v${VERSION}-x86_64-apple-darwin.tar.gz"
            "tomorrowci-v${VERSION}-aarch64-apple-darwin.tar.gz"
            "tomorrowci-v${VERSION}-x86_64-pc-windows-msvc.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "$archive"
          done
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 4
          sha256sum ./*.tar.gz ./*.zip ./sbom.cdx.json ./claim-to-evidence.md > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Candidate artifact upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-dist
          path: dist/*
          if-no-files-found: error
