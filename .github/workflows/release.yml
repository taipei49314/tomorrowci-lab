name: release

on:
  push:
    tags: ["v0.1.1-alpha.3", "v0.1.1-alpha.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml

  build:
    needs: acceptance
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build host target (named archive matches runner)
        run: cargo build -p tomorrowci-cli --release
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="v0.1.1-alpha.3"
          fi
          VER="${VER//\//-}"
          STAGE="tomorrowci-${VER}-${{ matrix.target }}"
          mkdir -p "dist/$STAGE"
          cp target/release/tomorrowci "dist/$STAGE/"
          cp README.md LICENSE CHANGELOG.md "dist/$STAGE/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          ./target/release/tomorrowci --version | tee dist/version.txt
          grep -E '0\.1\.1-alpha\.3' dist/version.txt
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = "v0.1.1-alpha.3"
          }
          $ver = $ver -replace '/','-'
          $stage = "tomorrowci-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item target/release/tomorrowci.exe "dist/$stage/"
          Copy-Item README.md,LICENSE,CHANGELOG.md "dist/$stage/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"
          ./target/release/tomorrowci.exe --version | Tee-Object dist/version.txt
          if (-not (Select-String -Path dist/version.txt -Pattern '0\.1\.1-alpha\.3')) { throw "version mismatch" }
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  checksums-and-release:
    needs: [acceptance, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Require all three platform archives + checksums + SBOM
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          ls -la
          test -f *x86_64-unknown-linux-gnu*.tar.gz || test -f *linux*.tar.gz
          test -f *x86_64-apple-darwin*.tar.gz || test -f *darwin*.tar.gz
          test -f *x86_64-pc-windows-msvc*.zip || test -f *windows*.zip
          # exact count: at least 3 archives
          test "$(ls -1 | grep -E '\.(tar\.gz|zip)$' | wc -l)" -ge 3
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          # verify each
          sha256sum -c SHA256SUMS.txt
      - name: Generate SBOM from Cargo.lock (preserve multi-version pairs)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          lock = Path("Cargo.lock").read_text(encoding="utf-8")
          pkgs = []
          for block in lock.split("[[package]]"):
              if not block.strip():
                  continue
              name = re.search(r'^name = "([^"]+)"', block, re.M)
              ver = re.search(r'^version = "([^"]+)"', block, re.M)
              if name and ver:
                  pkgs.append((name.group(1), ver.group(1)))
          assert pkgs, "no packages parsed from Cargo.lock"
          assert all(v != "locked" for _, v in pkgs)
          # multi-version packages must remain distinct entries
          from collections import Counter
          counts = Counter(n for n, _ in pkgs)
          multi = {n: c for n, c in counts.items() if c > 1}
          print("packages", len(pkgs), "multi-version", multi)
          components=[{"type":"library","name":n,"version":v,"purl":f"pkg:cargo/{n}@{v}"} for n,v in pkgs]
          ver="0.1.1-alpha.3"
          for line in Path("Cargo.toml").read_text(encoding="utf-8").splitlines():
            if line.strip().startswith("version ="):
              ver=line.split("=",1)[1].strip().strip('"'); break
          sbom={"bomFormat":"CycloneDX","specVersion":"1.5","version":1,
                "metadata":{"component":{"type":"application","name":"tomorrowci","version":ver}},
                "components":components}
          data=json.dumps(sbom, indent=2)+"\n"
          Path("dist/sbom.cdx.json").write_text(data, encoding="utf-8")
          assert not Path("dist/sbom.cdx.json").read_bytes().startswith(b"\xef\xbb\xbf")
          # round-trip vs lock pairs
          locked = set(pkgs)
          sbom_pairs = {(c["name"], c["version"]) for c in components}
          assert locked == sbom_pairs, (locked - sbom_pairs, sbom_pairs - locked)
          print("components", len(components), "version", ver)
          PY
      - name: Package source archive + exact-commit bundle
        run: |
          set -euo pipefail
          # Tag ref names only; branch names (workflow_dispatch) contain '/' and break paths.
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="v0.1.1-alpha.3"
          fi
          # strip any residual path separators
          VER="${VER//\//-}"
          mkdir -p dist bundle/source bundle/release bundle/live-evidence bundle/demo-report
          git archive --format=tar.gz --prefix=tomorrowci-src/ -o "dist/tomorrowci-${VER}-source.tar.gz" HEAD
          tar -xzf "dist/tomorrowci-${VER}-source.tar.gz" -C bundle/source --strip-components=1
          # platform archives + SBOM into release/ (exclude the source tarball we just made)
          shopt -s nullglob
          for f in dist/*x86_64-unknown-linux-gnu*.tar.gz dist/*x86_64-apple-darwin*.tar.gz dist/*x86_64-pc-windows-msvc*.zip dist/SHA256SUMS.txt dist/sbom.cdx.json; do
            cp -a "$f" bundle/release/
          done
          # Always produce fresh live evidence on this runner so hidden workspace
          # files (.tomorrowci.yml) are present (artifact upload historically strips them).
          echo "Generating exact-commit live evidence for self-verifying bundle"
          cargo build -p tomorrowci-cli --release
          FIXTURE=fixtures/python-runtime-break
          ./target/release/tomorrowci scan "$FIXTURE" --config "$FIXTURE/.tomorrowci.yml" | tee /tmp/scan.out
          RUN_ID=$(sed -n 's/^run_id: //p' /tmp/scan.out | tail -1)
          test -n "$RUN_ID"
          LIVE_ROOT="$FIXTURE/.tomorrowci/runs/$RUN_ID"
          test -f "$LIVE_ROOT/workspace/.tomorrowci.yml"
          ./target/release/tomorrowci verify "$RUN_ID" || (cd "$FIXTURE" && ../../target/release/tomorrowci verify "$RUN_ID")
          # Drop non-manifest scenario state under workspace (container-owned caches)
          while IFS= read -r -d '' d; do
            sudo rm -rf "$d" || rm -rf "$d" || true
          done < <(find "$LIVE_ROOT" -type d -path '*/workspace/.tomorrowci' -print0 2>/dev/null || true)
          ./target/release/tomorrowci verify "$RUN_ID" || (cd "$FIXTURE" && ../../target/release/tomorrowci verify "$RUN_ID")
          LIVE_RUN_ID=$(basename "$LIVE_ROOT")
          cp -a "$LIVE_ROOT" "bundle/live-evidence/${LIVE_RUN_ID}"
          cp -a "$LIVE_ROOT/report.html" bundle/demo-report/
          cp -a "$LIVE_ROOT/run.json" bundle/demo-report/
          echo "live_run_id=${LIVE_RUN_ID}" >> "$GITHUB_ENV"
          # Linux binary for self-verify
          LINUX_TGZ=$(ls dist/*x86_64-unknown-linux-gnu*.tar.gz | head -1)
          rm -rf /tmp/linux-stage
          mkdir -p /tmp/linux-stage
          tar -xzf "$LINUX_TGZ" -C /tmp/linux-stage
          BIN=$(find /tmp/linux-stage -type f -name tomorrowci | head -1)
          test -x "$BIN"
          mkdir -p /tmp/bundle-verify/.tomorrowci/runs
          cp -a "bundle/live-evidence/${LIVE_RUN_ID}" /tmp/bundle-verify/.tomorrowci/runs/
          (cd /tmp/bundle-verify && "$BIN" verify "$LIVE_RUN_ID")
          echo "bundle self-verify: PASS run_id=${LIVE_RUN_ID} binary=$($BIN --version)" | tee bundle/VERIFY.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from datetime import datetime, timezone
          root = Path("bundle")
          files = {}
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  rel = p.relative_to(root).as_posix()
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  files[rel] = {"size": p.stat().st_size, "sha256": f"sha256:{h}"}
          man = {
            "schema_version": 1,
            "tag": os.environ.get("GITHUB_REF_NAME", "v0.1.1-alpha.3"),
            "git_sha": os.environ["GITHUB_SHA"],
            "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
            "live_run_id": os.environ.get("live_run_id") or None,
            "tool_version": "0.1.1-alpha.3",
            "files": files,
            "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("bundle/BUNDLE_MANIFEST.json").write_text(json.dumps(man, indent=2)+"\n", encoding="utf-8")
          print("bundle files", len(files), "live", man["live_run_id"])
          PY
          (cd bundle && zip -r "../dist/tomorrowci-${VER}-bundle.zip" .)
          ls -la dist/
          test -f "dist/tomorrowci-${VER}-bundle.zip"
          test -f "dist/tomorrowci-${VER}-source.tar.gz"
      - name: Generate RELEASE_PROVENANCE.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          from datetime import datetime, timezone
          dist=Path('dist')
          arts={}
          for p in sorted(dist.iterdir()):
            if p.is_file() and p.name not in ('RELEASE_PROVENANCE.json',):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              arts[p.name]={"size":p.stat().st_size,"sha256":f"sha256:{h}"}
          live=os.environ.get("live_run_id") or None
          src_key=next((k for k in arts if k.endswith("-source.tar.gz")), None)
          bundle_key=next((k for k in arts if k.endswith("-bundle.zip")), None)
          prov={
            "schema_version":1,
            "tag": os.environ.get("GITHUB_REF_NAME","v0.1.1-alpha.3"),
            "git_sha": os.environ["GITHUB_SHA"],
            "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
            "workflow_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
            "repository": os.environ.get("GITHUB_REPOSITORY","taipei49314/tomorrowci-lab"),
            "tool_version":"0.1.1-alpha.3",
            "acceptance_jobs":{"status":"see_workflow_run"},
            "live_run_id": live,
            "evidence_artifact_sha256": arts.get(bundle_key,{}).get("sha256") if bundle_key else None,
            "source_archive_sha256": arts.get(src_key,{}).get("sha256") if src_key else None,
            "sbom_sha256": arts.get("sbom.cdx.json",{}).get("sha256"),
            "release_artifacts": arts,
            "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          Path('dist/RELEASE_PROVENANCE.json').write_text(json.dumps(prov, indent=2)+"\n", encoding='utf-8')
          # also embed provenance in dist for release
          print(json.dumps(prov, indent=2))
          PY
      - name: Create GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dry-run artifact upload
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
