name: release

on:
  push:
    tags: ["v0.1.1-alpha.3", "v0.1.1-alpha.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml

  build:
    needs: acceptance
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build host target (named archive matches runner)
        run: cargo build -p tomorrowci-cli --release
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME:-v0.1.1-alpha.3}"
          STAGE="tomorrowci-${VER}-${{ matrix.target }}"
          mkdir -p "dist/$STAGE"
          cp target/release/tomorrowci "dist/$STAGE/"
          cp README.md LICENSE CHANGELOG.md "dist/$STAGE/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          ./target/release/tomorrowci --version | tee dist/version.txt
          grep -E '0\.1\.1-alpha\.3' dist/version.txt
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.1-alpha.3" }
          $stage = "tomorrowci-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item target/release/tomorrowci.exe "dist/$stage/"
          Copy-Item README.md,LICENSE,CHANGELOG.md "dist/$stage/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"
          ./target/release/tomorrowci.exe --version | Tee-Object dist/version.txt
          if (-not (Select-String -Path dist/version.txt -Pattern '0\.1\.1-alpha\.3')) { throw "version mismatch" }
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  checksums-and-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Require all three platform archives + checksums + SBOM
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          ls -la
          test -f *x86_64-unknown-linux-gnu*.tar.gz || test -f *linux*.tar.gz
          test -f *x86_64-apple-darwin*.tar.gz || test -f *darwin*.tar.gz
          test -f *x86_64-pc-windows-msvc*.zip || test -f *windows*.zip
          # exact count: at least 3 archives
          test "$(ls -1 | grep -E '\.(tar\.gz|zip)$' | wc -l)" -ge 3
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          # verify each
          sha256sum -c SHA256SUMS.txt
      - name: Generate SBOM from Cargo.lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          lock = Path("Cargo.lock").read_text(encoding="utf-8")
          pkgs = re.findall(r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"', lock)
          components=[{"type":"library","name":n,"version":v,"purl":f"pkg:cargo/{n}@{v}"} for n,v in pkgs]
          assert components and all(c["version"] != "locked" for c in components)
          ver="0.1.1-alpha.3"
          for line in Path("Cargo.toml").read_text(encoding="utf-8").splitlines():
            if line.strip().startswith("version ="):
              ver=line.split("=",1)[1].strip().strip('"'); break
          sbom={"bomFormat":"CycloneDX","specVersion":"1.5","version":1,
                "metadata":{"component":{"type":"application","name":"tomorrowci","version":ver}},
                "components":components}
          data=json.dumps(sbom, indent=2)+"\n"
          Path("dist/sbom.cdx.json").write_text(data, encoding="utf-8")
          assert not Path("dist/sbom.cdx.json").read_bytes().startswith(b"\xef\xbb\xbf")
          print("components", len(components), "version", ver)
          PY
      - name: Generate RELEASE_PROVENANCE.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          from datetime import datetime, timezone
          dist=Path('dist')
          arts={}
          for p in sorted(dist.iterdir()):
            if p.is_file() and p.name not in ('RELEASE_PROVENANCE.json',):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              arts[p.name]={"size":p.stat().st_size,"sha256":f"sha256:{h}"}
          prov={
            "schema_version":1,
            "tag": os.environ.get("GITHUB_REF_NAME","v0.1.1-alpha.3"),
            "git_sha": os.environ["GITHUB_SHA"],
            "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
            "workflow_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
            "repository": os.environ.get("GITHUB_REPOSITORY","taipei49314/tomorrowci-lab"),
            "tool_version":"0.1.1-alpha.3",
            "acceptance_jobs":{"status":"see_workflow_run"},
            "live_run_id": None,
            "evidence_artifact_sha256": None,
            "source_archive_sha256": None,
            "sbom_sha256": arts.get("sbom.cdx.json",{}).get("sha256"),
            "release_artifacts": arts,
            "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          Path('dist/RELEASE_PROVENANCE.json').write_text(json.dumps(prov, indent=2)+"\n", encoding='utf-8')
          print(json.dumps(prov, indent=2))
          PY
      - name: Create GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dry-run artifact upload
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
